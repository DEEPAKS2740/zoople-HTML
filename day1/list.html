<!DOCTYPE html>
<html>
 <head>
<title>list</title>
 </head>
 <body>
 <h1>ordered list</h1>
 <ol type="1">
    <li>apple</li>
    <li>mango</li>
 </ol>   
 <h2>Unordered list</h2>
<ul>
    <li>apple</li>
    <li>mango</li>
</ul>
<h2>definition list</h2>
<dl>
    <dt>html</dt>
    <dd>hyper text</dd>
    <dt>css</dt>
    <dd>cascading</dd>
</dl>
<h2>nested list</h2>
<ol>
    <li>science
    <ul>
        <li>physics</li>
        <li>chemistry</li>
    </ul>
    </li>
    
        <li>maths</li>
    </ol>
 </body>   
</html>
